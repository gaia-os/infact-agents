[project]
name = "infact-agents"
version = "0.1.0"
description = "Agentic fact-checking framework with model-agnostic InFact nodes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "ollama>=0.4",
    "pypdf>=4.0",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infact_agents"]
