[project]
name = "infact-agents"
version = "0.1.0"
description = "Agentic fact-checking framework with model-agnostic InFact nodes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "ollama>=0.4",
    "pypdf>=4.0",
    "pillow>=10.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
infact-api = "infact_agents.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infact_agents"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ollama: integration tests that call a real Ollama server (skipped if unavailable)",
]
